<p>　　【共同社9月27日电】日本大相扑秋季赛事27日迎来最后一天，横纲大之里在与战绩相同的大关安青锦的对决中获胜，以12胜3负的成绩第六次夺得冠军，也是近六个赛事以来首次夺冠。</p>
<p>　　来自乌克兰的安青锦未能实现连续两个赛事夺冠，也无缘第四次夺冠。</p>
