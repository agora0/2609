<p>　　【共同社北京9月27日电】日本前外相岩屋毅担任会长的日本国际贸易促进协会（国贸促）代表团27日抵达中国北京首都国际机场。去年11月首相高市早苗作出关于台湾有事的国会答辩后，日中经济界交流陷入停滞，代表团此行将摸索改善双边关系的突破口。</p>
