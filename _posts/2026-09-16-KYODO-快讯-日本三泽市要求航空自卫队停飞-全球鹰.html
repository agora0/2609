<p>　　【共同社9月16日电】关于隶属日本航空自卫队三泽基地的无人侦察机“全球鹰”坠机一事，该基地所在的青森县三泽市16日致函三泽基地司令与防卫省东北防卫局长，要求查明事故原因，并且在弄清楚原因之前停止“全球鹰”的运用和飞行。</p>
