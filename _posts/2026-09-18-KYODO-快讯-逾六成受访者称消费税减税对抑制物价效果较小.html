<p>　　【共同社9月18日电】共同社最新舆论调查结果显示，对于日本政府计划明年4月起将食品饮料的消费税税率下调至1%，63.1%的受访者认为此举作为应对物价飙升措施的“效果较小”，认为“效果较大”的则占30.2%。</p>
