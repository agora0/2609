<p>　　【共同社9月25日电】日本财务相片山皋月25日晚向媒体透露，与美国财政部长贝森特举行了线上会谈。她表示，双方就日元持续走弱的汇市动向进行了磋商，“再次确认日元被低估是个问题”。</p>
