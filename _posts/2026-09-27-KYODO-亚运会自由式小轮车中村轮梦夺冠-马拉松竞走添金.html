    <p>　　【共同社9月27日电】爱知·名古屋亚运会27日的自由式小轮车男子公园赛中，开幕式担任日本代表团旗手的中村轮梦夺冠。</p>

<p>　　当天的男子马拉松竞走决赛中，胜木隼人以3小时03分36秒的成绩夺得金牌。电竞项目5人组队角逐的“宝可梦大集结”中，日本队夺冠。</p>
