    <p>　　【共同社9月29日电】日本冲绳县知事玉城丹尼29日任期届满。他在县政府举行的卸任记者会上就美军基地负担问题表示担忧，指出“如果依然任由国家处理，在未向县民充分寻求理解并说明的状态下，过重负担非但不会减少，还会不断增大。”</p>
