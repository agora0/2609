    <p>　　【共同社9月29日电】日本总务省29日公布的2025年人口普查确定值显示，截至2025年10月1日，包含外国人在内的日本总人口为122,972,528人，较2020年的上次调查减少3,173,571人，降幅为2.5%。</p>
