<p>　　【共同社9月22日电】据日本千叶县政府和该县警方消息，受今年第25号台风“杜鹃”影响，22日确认新增2人死亡。遇难者是鸭川市一名80多岁男性和茂原市一名80多岁女性，均遭遇了山体滑坡。千叶县的死亡人数增至5人，加上神奈川县的1人，合计死亡人数为6人。</p>
