<p>　　【共同社9月27日电】日本首相高市早苗26日与美国总统特朗普举行了电话会谈，持续约20分钟。会谈后高市在官邸向媒体透露了上述消息。据称，高市在电话中表示“日美如今已成为彼此最为信赖的盟国”。她还称，双方确认了“将共同为世界的和平与稳定作出贡献”。</p>
