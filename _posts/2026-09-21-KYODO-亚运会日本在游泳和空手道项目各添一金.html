    <p>　　【共同社9月21日电】爱知·名古屋亚运会21日迎来第三天，17岁的日本选手大桥信在男子100米蛙泳比赛中摘得金牌。空手道男子个人型比赛中西山走夺冠。至此，本届亚运会日本金牌数量总计达8枚。</p>
