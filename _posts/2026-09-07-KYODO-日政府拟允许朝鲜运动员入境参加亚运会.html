    <p>　　【共同社9月7日电】日本政府相关人士7日透露，政府已进行讨论，拟允许有意参加19日开幕的爱知·名古屋亚运会的朝鲜运动员等人士入境。</p>

<p>　　日政府针对朝鲜的核与导弹开发等实施单边制裁，原则上禁止持朝鲜国籍者入境，但在体育交流方面，过去也曾作为例外予以允许。</p>
