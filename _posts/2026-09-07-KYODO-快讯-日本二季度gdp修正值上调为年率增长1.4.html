<p>　　【共同社9月8日电】日本内阁府8日公布的2026年二季度（4至6月）国内生产总值（GDP）修正值显示，实际GDP较上季度增长0.4%，换算成年率为增长1.4%。这与8月公布的年率增长1.1%初值相比有所上调。</p>
