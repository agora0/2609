<p>　　【共同社北京9月13日电】日本跨党派团体“日中友好议员联盟”众议员高村正大等年轻成员13日访问中国北京。这是日本首相高市早苗去年11月作出涉台国会答辩导致日中关系降温后，该议联首次派团访华。</p>
