<p>（中央社台北29日電）根據中央氣象署最新資訊，今天凌晨2時20分發生芮氏規模5地震，地震深度16.3公里，震央位於花蓮縣政府東南方33.3公里（位於台灣東部海域），最大震度花蓮縣3級。（編輯：陳彥鈞）1150929</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/25961/">#花蓮縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div></div>
