                      </picture><figcaption class="picinfo">東南部海域7日0時37分發生芮氏規模4.8地震。（圖取自中央氣象署網頁cwa.gov.tw）</figcaption></figure><p>（中央社台北7日電）根據中央氣象署最新資訊，今天0時37分發生芮氏規模4.8地震，地震深度32.1公里，震央位在台東縣政府東南東方23.8公里（位在台灣東南部海域），最大震度台東縣4級。（編輯：何宏儒）1150907</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4514/">#台東縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4516/">#台東縣政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div></div>
