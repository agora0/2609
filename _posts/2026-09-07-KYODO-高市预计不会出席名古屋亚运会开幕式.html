<p>　　【共同社9月7日电】日本政府高官7日透露，预计首相高市早苗不会出席19日在名古屋市举行的爱知·名古屋亚运会开幕式。天皇夫妇将出席开幕式，并由天皇宣布开幕。担任本届赛事名誉总裁的秋筱宫将携纪子妃出席。</p>
<p>　　1994年的广岛亚运会上，时任首相村山富市也未出席开幕式。</p>
