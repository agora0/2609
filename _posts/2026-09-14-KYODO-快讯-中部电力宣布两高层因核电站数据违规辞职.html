<p>　　【共同社9月14日电】日本中部电力公司14日宣布，社长林欣吾和董事长胜野哲辞职，为滨冈核电站抗震设计相关数据违规一事承担责任。公司还表示将撤回涉事核电站3、4号机组的重启审查申请。</p>
