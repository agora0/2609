    <p>　　【共同社9月28日电】以电视剧《北国之恋》、《前略母亲大人》闻名日本剧作家仓本聪18日因多器官衰竭去世，享年91岁。仓本生于东京都，生前还创立“富良野塾”致力于培养后辈。</p>
