<p>　　【共同社9月24日电】23日夜晚，原定飞往佐贺机场的全日空1502次航班因右侧引擎发生故障紧急降落在出发地那霸机场，机上158名乘客和机组人员通过逃生滑梯撤离。3名乘客在撤离时受到擦伤等轻伤。</p>
