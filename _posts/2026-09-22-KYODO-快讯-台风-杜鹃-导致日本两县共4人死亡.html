    <p>　　【共同社9月22日电】日本千叶县22日发布的消息显示，受今年第25号台风“杜鹃”影响，该县已有3人死亡。再加上神奈川县的1人，死亡人数合计为4人。此外，千叶县有2人失联，再加上神奈川县的4人，失联人数合计为6人。</p>
