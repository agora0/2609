<p>　　【共同社阿什维尔9月1日电】日本央行行长植田和男在二十国集团（G20）财长和央行行长会议闭幕后的记者会上就进一步加息的判断表示：“包括下次会议在内，想在每次会议上展开讨论。”他对经济和物价前景发表看法，指出将与7月底基本相同。</p>
