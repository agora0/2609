<p>　　【共同社纽约9月22日电】美国东部时间22日，日本首相高市早苗在纽约联合国总部与美国总统特朗普举行了会谈。在24日预定举行的美中首脑会谈之前，两人确认了将在经济安全保障等领域保持密切合作的方针。日本政府高官透露了上述消息。</p>
