    <p>　　【共同社9月25日电】日本官房长官木原稔25日在记者会上就美国总统特朗普与中国国家主席习近平的会谈表示：“予以高度关注，将与美国紧密合作。”</p>

<p>　　关于美中关系，他再次强调“重要的是要有助于国际社会的稳定”。</p>
