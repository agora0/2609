<p>　　【共同社9月25日电】日本财务相片山皋月25日在内阁会议后的记者会上透露，22日在美国纽约举行的日美首脑会谈中，“特朗普总统表达了对日元贬值的关切”。她还表示，首相高市早苗当时称“从一般意义上说，日元被低估是个问题”。</p>
