    <p>　　【共同社辛辛那提9月17日电】在17日的美职棒大联盟常规赛中，大谷翔平、山本由伸、佐佐木朗希所在的洛杉矶道奇队客场8比2战胜辛辛那提红人队，实现国联西区五连冠。</p>

<p>　　大谷和佐佐木被列入伤病名单（IL），此前15日先发登板并拿下胜投的山本当天没有上场。</p>
