                      </picture><figcaption class="picinfo">台灣東南部海域4日下午5時11分發生芮氏規模4.5地震，最大震度台東縣4級。（圖取自氣象署網頁cwa.gov.tw）</figcaption></figure><p>（中央社台北4日電）根據中央氣象署最新資訊，今天下午5時11分發生芮氏規模4.5地震，地震深度13.7公里，震央位於台東縣政府東南東方44.9公里(位於台灣東南部海域)，最大震度台東縣4級。（編輯：張銘坤）1150904</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4514/">#台東縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4516/">#台東縣政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/6214/">#地震</a></div></div>
