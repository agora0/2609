    <p>　　【共同社9月30日电】30日的日本国债市场上，作为长期利率指标的新发10年期国债（第383期，票面利率2.7%）收益率较上一交易日下降0.025%，为3.060%。</p>

<p>　　长期利率近期持续上升，吸引了买盘入场，导致收益率回落。</p>
