<p>　　【共同社9月10日电】据日本国土交通省那霸机场事务所称，10日晚上7点15分左右，一架航空自卫队F-15战机紧急降落，导致跑道关闭。目前没有人员受伤报告。机场利用另一条跑道进行民航客机起降。</p>
