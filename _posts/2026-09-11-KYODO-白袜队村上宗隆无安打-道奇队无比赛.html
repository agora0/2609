<p>　　【共同社芝加哥9月11日电】美职棒大联盟常规赛10日在各地举行。芝加哥白袜队的村上宗隆在对阵匹兹堡海盗队时作为“第三棒･一垒”上场，成绩为4打数无安打。白袜队以0比2告负。</p>
<p>　　大谷翔平等人效力的洛杉矶道奇队当天无比赛。</p>
