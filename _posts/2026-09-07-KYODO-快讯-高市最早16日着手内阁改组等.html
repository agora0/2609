<p>　　【共同社9月7日电】7日获悉，日本首相高市早苗正在探讨最早16日着手内阁改组和自民党高层人事调整。官邸方面已通知自民党方面相关日程，即高市将在15日的党高层会议上获得对高层人事安排的全权委任。</p>
