<p>　　【共同社9月4日电】日本总务省4日公布的7月家庭收支调查结果显示，两人以上家庭户均消费支出为30.1245万日元（约合人民币1.3万元），剔除物价变动因素后实际支出较上年同期減少3.6%，连续8个月同比减少。</p>
