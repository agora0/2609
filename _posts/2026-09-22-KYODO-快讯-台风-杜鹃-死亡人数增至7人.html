<p>　　【共同社9月22日电】日本神奈川县政府22日表示，因今年第25号台风“杜鹃”造成的山体滑坡而此前下落不明的该县横须贺市男性被发现，确认已经死亡。该人遭遇了住宅倒塌事故。神奈川县内的死者增至2人，加上千叶县的5人，合计死亡人数为7人。</p>
