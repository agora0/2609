<p>　　【共同社石家庄9月16日电】日中战争时期被强掳的中国籍受害者遗属等50人16日向河北省石家庄市法院提交诉状，要求6家日本企业向每名受害者赔偿约37万元人民币。原告代理人透露了该消息。</p>
