    <p>　　【共同社9月24日电】爱知·名古屋亚运会24日晚举行乒乓球男团决赛，日本队战胜中国队，夺得了金牌。这是日本乒乓球男团自1966年亚运会以来再次夺金，时隔60年。</p>
