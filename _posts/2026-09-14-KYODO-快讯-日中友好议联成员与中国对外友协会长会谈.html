<p>　　【共同社北京9月14日电】日本跨党派团体“日中友好议员联盟”的前法务副大臣高村正大（自民党）等年轻成员14日在访问地中国北京，与中国人民对外友好协会会长杨万明举行了会谈。高村透露了该消息。</p>
